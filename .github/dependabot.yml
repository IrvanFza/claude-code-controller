version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
      - /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Paris
    target-branch: main
    open-pull-requests-limit: 10
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tools/dev
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Paris
    target-branch: main
    groups:
      development-tools:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Paris
    target-branch: main
    groups:
      github-actions:
        patterns: ["*"]
